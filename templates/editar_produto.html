{% extends 'base.html' %}

{% block title %}Editar Produto | Delicatto{% endblock %}

{% block content %}
<section class="login-page">
    <div class="login-box">
        <h1>Editar Produto</h1>

        <form method="POST" enctype="multipart/form-data">
            <!-- NOME -->
            <input type="text" name="nome" value="{{ produto[1] }}" required>
            
            <!-- DESCRIÇÃO -->
            <input type="text" name="descricao" value="{{ produto[2] }}" required>
            
            <!-- PREÇO -->
            <input type="number" step="0.01" name="preco" value="{{ produto[3] }}" required>
            
            <!-- CATEGORIA -->
            <div class="form-group">
                <label>Categoria</label>
                <select name="categoria" required>
                    <option value="Cuidados Faciais" {% if produto[9] == 'Cuidados Faciais' %}selected{% endif %}>
                        Cuidados Faciais
                    </option>
                    <option value="Cuidados Corporais" {% if produto[9] == 'Cuidados Corporais' %}selected{% endif %}>
                        Cuidados Corporais
                    </option>
                    <option value="Perfumes" {% if produto[9] == 'Perfumes' %}selected{% endif %}>
                        Perfumes
                    </option>
                    <option value="Cuidados Capilares" {% if produto[9] == 'Cuidados Capilares' %}selected{% endif %}>
                        Cuidados Capilares
                    </option>
                    <option value="Maquiagem" {% if produto[9] == 'Maquiagem' %}selected{% endif %}>
                        Maquiagem
                    </option>
                </select>
            </div>
            
            <!-- IMAGEM ATUAL -->
            <div class="imagem-atual">
                <p>Imagem atual:</p>
                <img src="{{ url_for('static', filename='img/' + produto[4]) }}" 
                     alt="{{ produto[1] }}" 
                     style="max-width: 150px; border-radius: 10px; margin: 10px 0;">
                <p><small>Nome do arquivo: {{ produto[4] }}</small></p>
            </div>
            
            <!-- UPLOAD DE NOVA IMAGEM -->
            <input type="file" name="imagem" accept="image/*">
            <p><small>Deixe em branco para manter a imagem atual</small></p>

            <!-- DESCRIÇÃO COMPLETA -->
            <textarea name="descricao_completa" rows="4" required>{{ produto[5] }}</textarea>
            
            <!-- MODO DE USO -->
            <textarea name="modo_uso" rows="4" required>{{ produto[6] }}</textarea>
            
            <!-- BENEFÍCIOS -->
            <textarea name="beneficios" rows="4" required>{{ produto[7] }}</textarea>
            
            <!-- INGREDIENTES -->
            <textarea name="ingredientes" rows="4" required>{{ produto[8] }}</textarea>

            <button type="submit">Salvar Alterações</button>
        </form>
    </div>
</section>
{% endblock %}
