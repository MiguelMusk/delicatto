{% extends 'base.html' %}

{% block title %}Cadastro | Delicatto{% endblock %}

{% block content %}
<section class="login-page">
    <div class="login-box">
        <a href="/">
            <img src="{{ url_for('static', filename='img/logo.png') }}" class="login-logo">
        </a>
        <h1>Criar Conta</h1>
        <p>Faça parte da experiência Delicatto</p>

        <form method="POST">
            <input type="text" name="nome" placeholder="Seu nome" required>
            <input type="email" name="email" placeholder="Seu e-mail" required>
            <input type="password" name="senha" placeholder="Sua senha" required>
            <button type="submit">Criar Conta</button>
        </form>

        {% if mensagem %}
            <p class="success-msg">{{ mensagem }}</p>
        {% endif %}

        <span class="register-link">
            Já possui conta? <a href="/login">Entrar</a>
        </span>
    </div>
</section>
{% endblock %}
